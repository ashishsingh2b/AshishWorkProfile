<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="12" y1="14" x2="52" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="pythonGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Squircle Background Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" stroke="url(#accentGrad)" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- Top Terminal Header Dots (Developer Identity) -->
  <circle cx="14" cy="12" r="2" fill="#f43f5e" />
  <circle cx="21" cy="12" r="2" fill="url(#pythonGold)" />
  <circle cx="28" cy="12" r="2" fill="#10b981" />

  <!-- Left & Right Code Brackets -->
  <path d="M13 27L7.5 34L13 41" stroke="#60a5fa" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M51 27L56.5 34L51 41" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Crisp Vector 'A' for Ashish -->
  <path d="M17.5 44L24.5 23H28.5L35.5 44H31.2L29.7 39.2H23.3L21.8 44H17.5ZM24.4 35.6H28.6L26.5 28.4L24.4 35.6Z" fill="#ffffff" />

  <!-- Crisp Vector 'S' for Singh -->
  <path d="M44.2 29.2C44 27.6 42.6 26.6 40.5 26.6C38.5 26.6 37.2 27.5 37.2 28.9C37.2 30.1 38.1 30.8 40.1 31.3L42.6 31.9C46.2 32.8 48.2 34.6 48.2 37.8C48.2 41.7 45.1 44.3 40.4 44.3C35.6 44.3 32.7 41.8 32.4 38.1H36.6C36.9 39.8 38.3 40.8 40.5 40.8C42.7 40.8 44.1 39.8 44.1 38.2C44.1 36.9 43.1 36.2 41 35.6L38.3 34.9C35.1 34.1 33.1 32.2 33.1 29.2C33.1 25.4 36.2 23 40.6 23C45.1 23 47.9 25.4 48.2 29.2H44.2Z" fill="url(#accentGrad)" />

  <!-- Python Gold & Blue Accent Bar at Bottom -->
  <rect x="20" y="50" width="11" height="3" rx="1.5" fill="#38bdf8" />
  <rect x="33" y="50" width="11" height="3" rx="1.5" fill="url(#pythonGold)" />
</svg>
